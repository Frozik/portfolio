version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
breaking:
  # JSON travels on the wire, so field names are part of the contract too.
  use:
    - WIRE_JSON
  # Calls Filter is not released to anyone yet: its contract is free to change, numbers and
  # all, until the first public release. Remove this then, and keep the contract from there on.
  ignore:
    - proto/frozik/callsfilter/v1/ruleset.proto
