syntax = "proto3";

// The rules Calls Filter's screening service executes at the moment of a call: compiled by
// the app's TypeScript from its group book and written to a file the Kotlin service reads.
// Times are floating minutes: local wall-clock minutes since 1970-01-01 00:00, no time zone.
package frozik.callsfilter.v1;

option java_multiple_files = true;
option java_package = "io.github.frozik.callsfilter.screening.wire";

message Ruleset {
  // The contract's major version; a reader that does not know it treats the file as absent.
  uint32 schema = 1;
  int64 compiled_at_epoch_ms = 2;
  // Schedule windows and baked events stop here; past it a group's conditions no longer hold.
  int64 horizon_end_minute = 3;
  // The SIM's country: incoming numbers are parsed as dialled from there.
  string home_country = 4;
  repeated Group groups = 5;
  // After a stranger's call rang through, the shade asks where the number goes, offering these
  // groups, most used first; empty when the user turned the question off.
  repeated GroupChoice where_to = 6;
  // The filter-wide «a repeat rings», over every group's own.
  RepeatPass repeat_pass = 7;
}

message GroupChoice {
  string id = 1;
  string name = 2;
}

enum GroupKind {
  GROUP_KIND_UNSPECIFIED = 0;
  GROUP_KIND_CUSTOM = 1;
  GROUP_KIND_MY_CONTACTS = 2;
  GROUP_KIND_STRANGERS = 3;
}

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_BLOCK = 1;
  ACTION_PASS = 2;
}

enum RepeatPassKind {
  REPEAT_PASS_KIND_UNSPECIFIED = 0;
  REPEAT_PASS_KIND_OFF = 1;
  REPEAT_PASS_KIND_ALWAYS = 2;
  REPEAT_PASS_KIND_UNTIL = 3;
}

// «A repeat rings»: when a rule blocks, a second call within the group's window rings anyway.
message RepeatPass {
  RepeatPassKind kind = 1;
  int64 until_epoch_ms = 2;
}

message Group {
  string id = 1;
  GroupKind kind = 2;
  repeated Member include = 3;
  repeated Member exclude = 4;
  bool exclude_my_contacts = 5;
  Policy policy = 6;
  // Switched off by the user: passed over in finding a caller's group, whatever its conditions.
  bool off = 7;
  // Ties of the fail-open rule go to the older group.
  int64 created_at_epoch_ms = 8;
  string auto_reply_text = 9;
  // What the user named a custom group, for the shade; empty for the special two, which the
  // service names in the phone's language.
  string name = 10;
}

enum NameField {
  NAME_FIELD_UNSPECIFIED = 0;
  NAME_FIELD_NETWORK = 1;
  NAME_FIELD_CONTACT = 2;
  NAME_FIELD_ANY = 3;
}

enum SpecialMask {
  SPECIAL_MASK_UNSPECIFIED = 0;
  SPECIAL_MASK_HIDDEN = 1;
  SPECIAL_MASK_FOREIGN = 2;
  SPECIAL_MASK_PREMIUM_RATE = 3;
  SPECIAL_MASK_VOIP = 4;
  SPECIAL_MASK_TOLL_FREE = 5;
}

message Member {
  string id = 1;
  oneof kind {
    // Anchored, over the E.164 digits without the plus.
    string number_regex = 2;
    NameMatch name = 3;
    SpecialMask special = 4;
    ContactMatch contact = 5;
  }
}

message NameMatch {
  // Anchored, over the normalized name.
  string regex = 1;
  NameField field = 2;
}

message ContactMatch {
  repeated string numbers = 1;
  string lookup_key = 2;
}

message Policy {
  // What the group does with a call it takes, while it is in force.
  Action action = 1;
  // When the group is in force; absent: always.
  Conditions conditions = 2;
  uint32 repeat_window_minutes = 3;
  RepeatPass repeat_pass = 4;
}

message Conditions {
  // False: no schedule, only calendars or places.
  bool has_schedule = 1;
  repeated Window windows = 2;
  repeated CalendarRule calendars = 3;
  // The IANA zone whose clock the windows are on; empty for the phone's own clock
  // wherever it is. The service reads the call's moment on this clock.
  string zone = 4;
  // Where the phone must (or must not) be; a place whose state is unknown does not count.
  repeated PlaceRule places = 5;
}

enum PlaceMode {
  PLACE_MODE_UNSPECIFIED = 0;
  PLACE_MODE_ONLY_AT = 1;
  PLACE_MODE_EXCEPT_AT = 2;
}

// A point and a radius; the service reads the geofence state the app keeps under `id`.
message PlaceRule {
  string id = 1;
  PlaceMode mode = 2;
  double latitude = 3;
  double longitude = 4;
  uint32 radius_meters = 5;
}

message Window {
  int64 from_minute = 1;
  int64 to_minute = 2;
}

enum CalendarMode {
  CALENDAR_MODE_UNSPECIFIED = 0;
  CALENDAR_MODE_EXCEPT_EVENTS = 1;
  CALENDAR_MODE_ONLY_DURING_EVENTS = 2;
}

message DeviceCalendar {
  string account_type = 1;
  string account_name = 2;
  string calendar_name = 3;
}

message EventFilter {
  bool skip_declined = 1;
  bool include_all_day = 2;
  uint32 minutes_before = 3;
  uint32 minutes_after = 4;
}

message CalendarRule {
  CalendarMode mode = 1;
  EventFilter filter = 2;
  oneof source {
    DeviceCalendar device = 3;
    string ics_id = 4;
  }
  // The events as the app last saw them, filter applied: all of an iCal feed, a month of a
  // device calendar (used when the calendar cannot be read at the moment of the call).
  repeated Window baked_events = 5;
}
