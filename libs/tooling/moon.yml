language: typescript
layer: tool

tags:
  - library

tasks:
  type-check:
    command: 'pnpm run types'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
    options:
      runInCI: true

  shellcheck:
    command: 'shellcheck --severity=warning scripts/android/ccache-env.sh scripts/android/install-ndk.sh'
    inputs:
      - 'scripts/**/*.sh'
    options:
      runInCI: true
