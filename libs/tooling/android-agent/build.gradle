// The e2e agent: an instrumentation test that does not end. Started once per run, it keeps
// UiAutomation connected and answers «where is this element» over a local socket in milliseconds,
// where every `uiautomator dump` starts the tool anew and takes two seconds. It is installed only
// on the emulator that runs the tests; no app under test carries any of it.
plugins {
  id 'com.android.application' version '8.12.0'
}

android {
  namespace 'io.github.frozik.e2eagent'
  compileSdk 36

  defaultConfig {
    applicationId 'io.github.frozik.e2eagent'
    // The emulators the tests run on are Android 14 and newer.
    minSdk 29
    targetSdk 36
    versionCode 1
    versionName '1'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
  androidTestImplementation 'junit:junit:4.13.2'
}
