language: typescript
layer: library

tags:
  - library

tasks:
  type-check:
    command: 'pnpm run types'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
    options:
      runInCI: true
  # sync.md §8.6 — the contract against rclone in Docker; plain `test` skips it.
  webdav-contract:
    command: 'bash scripts/webdav-contract.sh'
    options:
      cache: false
      runInCI: false
