language: typescript
layer: library

tags:
  - library

tasks:
  type-check:
    command: 'pnpm run types'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
    options:
      runInCI: true

  theme-fresh:
    command: 'pnpm run theme-fresh'
    inputs:
      - 'src/tokens/**/*'
      - 'scripts/generate-theme.ts'
    options:
      runInCI: true
