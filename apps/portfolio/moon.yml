language: typescript
layer: application
stack: frontend

tags:
  - application

fileGroups:
  sources:
    - 'src/**/*'
  vite:
    - 'public/**/*'
    - 'src/**/*'
    - 'index.html'
    - 'vite.config.ts'

tasks:
  build:
    command: 'pnpm run build'
    inputs:
      - '@group(vite)'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'vite-plugins/**/*'
    outputs:
      - 'dist'
    options:
      runInCI: true

  dev:
    command: 'pnpm run serve'
    options:
      persistent: true

  type-check:
    command: 'pnpm run types'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
    options:
      runInCI: true

  analyze:
    command: 'pnpm run analyze'
    inputs:
      - '@group(vite)'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
    outputs:
      - 'bundle-stats.html'
      - 'bundle-stats.json'
    options:
      runInCI: false

  install-browsers:
    command: 'playwright install --only-shell chromium'
    # No inputs: never "affected", so `moon ci` skips it; the workflow runs it explicitly.
    inputs: []
    options:
      cache: false

  e2e:
    command: 'pnpm exec playwright test'
    deps:
      - 'build'
    inputs:
      - '@group(vite)'
      - 'e2e/**/*'
      - 'playwright.config.ts'
    options:
      runInCI: true

  lighthouse:
    command: 'pnpm run lighthouse'
    inputs:
      - '@group(vite)'
      - 'lighthouserc.json'
    outputs:
      - '.lighthouseci'
    options:
      cache: false
      runInCI: false
