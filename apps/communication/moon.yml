language: typescript
layer: application
stack: backend

tags:
  - application

fileGroups:
  sources:
    - 'src/**/*'

tasks:
  # Node in watch mode plus the HTTP/3 gateway container when Docker is there.
  dev:
    command: 'pnpm run dev'
    options:
      persistent: true

  build:
    command: 'pnpm run build'
    inputs:
      - '@group(sources)'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
    outputs:
      - 'dist'
    options:
      runInCI: true

  type-check:
    command: 'pnpm run types'
    inputs:
      - '@group(sources)'
      - 'tsconfig.json'
    options:
      runInCI: true
