[server]
port = 4445
host = "0.0.0.0"
cors_allowed_origins = []
shutdown_grace_ms = 11000

[server.tls]
enabled = false
cert_path = ""
key_path = ""

[auth]
google_oauth_client_id = ""
yandex_oauth_client_id = ""
# yandex_oauth_client_secret is intentionally absent from this TOML and
# sourced only via the YANDEX_OAUTH_CLIENT_SECRET env var (parallel to
# TURN_SHARED_SECRET). Leaving it empty in the merged config disables
# the Yandex verifier — any handshake quoting `provider: 'yandex'` is
# rejected as `auth/invalid-token`.
yandex_oauth_client_secret = ""
token_expiry_warning_seconds = 60
clock_tolerance_seconds = 5

[auth.jwks]
fetch_max_attempts = 3
fetch_timeout_ms = 5000

[room]
max_listeners = 50
response_gather_timeout_ms = 10000
max_http_buffer_bytes = 1048576
max_tabs_per_user = 5
max_inflight_dispatches_per_socket = 32

[signal]
max_publish_per_second_per_socket = 100
max_publish_burst = 200
max_payload_bytes = 16384

[turn]
enabled = false
shared_secret = ""
realm = ""
ttl_seconds = 43200
urls = []
credential_requests_per_minute_per_socket = 5

[edge]
haproxy_enabled = false

[security]
handshake_rate_per_ip_per_minute = 60
failed_handshake_block_threshold = 10
failed_handshake_block_seconds = 30

[admin]
token = ""
port = 4446

[logging]
level = "info"
pretty = false

[build]
id = "unknown"
commit = "unknown"
version = "unknown"

[redis]
# v2 multi-node scaling. When disabled, the server uses an in-process room
# registry and a stock single-node Socket.IO adapter (no Redis dependency).
# Enable per host to fan-out room state + broadcasts across nodes via
# `@socket.io/redis-adapter` and a hash-per-room layout in Redis.
enabled = false
url = "redis://127.0.0.1:6379"
key_prefix = "comm:"

[transport]
# HTTP/3 (WebTransport) listens on UDP `http3_port`; the WebSocket fallback
# shares the public HTTPS port. Both carry the same Connect services on `path`.
enabled = true
path = "/transport"
http3_host = "0.0.0.0"
http3_port = 4447
max_sessions = 256
max_sessions_per_ip = 8
max_streams_per_session = 16
# A stream where nothing moves either way for this long is reset, whichever
# side stalled — a client that stops reading frees its echo slot too.
stream_idle_timeout_ms = 30000
# Per stream, the bytes a handler may leave unread: the server's memory bound.
stream_window_bytes = 262144
session_window_bytes = 1048576
expression_max_length = 200
expression_max_depth = 48
sample_max_points = 20000
sample_chunk_points = 1000

[transport.echo]
max_file_bytes = 1073741824
bytes_per_ip_per_hour = 4294967296
concurrent_per_ip = 2
concurrent_total = 16
rate_bytes_per_second = 25000000
