[server]
cors_allowed_origins = ["http://localhost:5173"]

[logging]
level = "debug"
pretty = true

[transport.gateway]
# The gateway runs in a container (apps/transport-gateway/compose.dev.yml) and
# reaches this host through host.docker.internal, which Docker Desktop routes to
# the host's loopback — so the listener stays off the local network.
enabled = true
host = "127.0.0.1"
secret = "development-gateway-secret"
