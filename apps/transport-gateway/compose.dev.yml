# The HTTP/3 gateway for development, started by `pnpm dev` in apps/communication.
# It serves the self-signed certificate Node writes to .dev-certs (browsers pin
# it by hash) and bridges to Node's gateway listener on the host.
name: transport-gateway-dev

services:
  gateway:
    build: .
    # Started by `pnpm dev`; it should not come back on its own with Docker.
    restart: "no"
    ports:
      - "4447:4447/udp"
    environment:
      GATEWAY_UPSTREAM_URL: ws://host.docker.internal:4448/transport
      TRANSPORT_GATEWAY_SECRET: development-gateway-secret
      GATEWAY_CERT_FILE: /certs/cert.pem
      GATEWAY_KEY_FILE: /certs/key.pem
      GATEWAY_CERT_RELOAD_INTERVAL: 5s
      GATEWAY_LOG_LEVEL: debug
    volumes:
      - ../communication/.dev-certs:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
