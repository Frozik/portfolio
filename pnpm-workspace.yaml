packages:
  - apps/**/*
  - libs/**/*

# pnpm 11: every setting lives here (no .npmrc / package.json "pnpm" field).
catalogMode: strict
# Do not try to reinstall from inside non-interactive `pnpm exec`/`pnpm run` (hooks, agents); just warn.
verifyDepsBeforeRun: warn

# pnpm 11 refuses to run dependency build scripts unless listed here.
allowBuilds:
  lefthook: true
  '@swc/core': true
  esbuild: true
  '@parcel/watcher': true
  core-js: false
  '@bufbuild/buf': false

peerDependencyRules:
  allowedVersions:
    "vite-plugin-pwa>vite": "8"

