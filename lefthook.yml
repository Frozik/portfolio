# Git hooks (lefthook). Commit stays fast: only staged files are linted and the
# affected type-checks run. Push runs what CI runs — `moon ci`, the tasks marked
# `runInCI` (build and e2e included) for what changed since origin/main — so CI
# finds nothing the push did not. Lighthouse and the server image stay CI jobs.

pre-commit:
  parallel: true
  jobs:
    - name: oxlint (staged files)
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt (staged files)
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css,scss}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: source conventions
      glob: '{apps,libs}/**/*.{ts,tsx}'
      run: pnpm exec check-source-conventions
    - name: type-check (affected)
      glob: '{apps,libs}/**/*.{ts,tsx}'
      run: pnpm exec moon run :type-check --affected

pre-push:
  jobs:
    # CI=1 gives Playwright its CI behaviour: retries, failOnFlakyTests and a
    # fresh preview server instead of whatever is already listening.
    - name: what CI runs
      run: CI=1 pnpm exec moon ci --base origin/main --head HEAD
