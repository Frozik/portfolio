id: root
language: typescript

# Repository-wide tasks. Everything a developer or CI runs goes through Moon:
# `moon check --all` is the full gate, `moon ci` runs only affected tasks in CI,
# and every task declares its inputs so unchanged work is served from the cache.
# Moon runs every task in CI unless it opts out, so developer-only tasks
# (fixers, coverage) carry `runInCI: false`.

fileGroups:
  sources:
    - 'apps/*/src/**/*'
    - 'libs/*/src/**/*'
    - 'apps/*/vite.config.ts'
    - 'vitest.config.ts'
  manifests:
    - 'package.json'
    - 'apps/*/package.json'
    - 'libs/*/package.json'
    - 'pnpm-workspace.yaml'

tasks:
  lint:
    command: 'oxlint .'
    inputs:
      - '@group(sources)'
      - '@group(manifests)'
      - '.oxlintrc.json'
      - 'libs/tooling/oxlint.json'
      - '*.{ts,js,json}'
    options:
      runInCI: true

  lint-fix:
    command: 'oxlint --fix .'
    options:
      cache: false
      runInCI: false

  format:
    command: 'oxfmt'
    options:
      cache: false
      runInCI: false

  format-check:
    command: 'oxfmt --check'
    inputs:
      - '@group(sources)'
      - '@group(manifests)'
      - '.oxfmtrc.json'
      - '*.{ts,js,json}'
    options:
      runInCI: true

  test:
    command: 'vitest run'
    inputs:
      - '@group(sources)'
      - 'vitest.config.ts'
    options:
      runInCI: true

  test-watch:
    command: 'vitest'
    options:
      persistent: true

  test-coverage:
    command: 'vitest run --coverage'
    outputs:
      - 'coverage'
    options:
      runInCI: false

  layers:
    command: 'depcruise --config libs/tooling/dependency-cruiser.cjs apps/portfolio/src apps/communication/src libs/utils/src libs/components/src libs/communication-protocol/src libs/tooling/src'
    inputs:
      - '@group(sources)'
      - 'libs/tooling/dependency-cruiser.cjs'
    options:
      runInCI: true

  knip:
    command: 'knip --no-progress --config libs/tooling/knip.json'
    inputs:
      - '@group(sources)'
      - '@group(manifests)'
      - 'libs/tooling/knip.json'
    options:
      runInCI: true

  conventions:
    command: 'pnpm exec check-source-conventions'
    inputs:
      - '@group(sources)'
      - 'libs/tooling/src/**/*'
      - 'libs/tooling/file-size-baseline.json'
    options:
      runInCI: true

  conventions-baseline:
    command: 'pnpm exec check-source-conventions --update-baseline'
    options:
      cache: false
      runInCI: false
