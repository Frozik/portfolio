version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router-dom']
      radix:
        patterns: ['@radix-ui/*']
      tooling:
        patterns: ['oxlint', 'oxfmt', '@moonrepo/*', 'vitest', '@vitest/*', 'vite', 'vite-plugin-pwa', 'typescript', 'knip', 'dependency-cruiser', 'lefthook']
    ignore:
      # Major bumps are reviewed by hand: the stack is at the edge already.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Both live twice in the lockfile — our catalog entry and a copy pinned by a
      # dependency (`@lhci/cli` → lighthouse 12, `@tensorflow/tfjs-core` →
      # @webgpu/types 0.1.38). Dependabot mixes the two up: it fails on the pinned
      # copy and once proposed downgrading the catalog. Bumped by hand instead.
      - dependency-name: 'lighthouse'
      - dependency-name: '@webgpu/types'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/communication
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
