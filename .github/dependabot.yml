version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router-dom']
      radix:
        patterns: ['@radix-ui/*']
      tooling:
        patterns: ['oxlint', 'oxfmt', '@moonrepo/*', 'vitest', '@vitest/*', 'vite', 'vite-plugin-pwa', 'typescript', 'knip', 'dependency-cruiser', 'lefthook']
    ignore:
      # Major bumps are reviewed by hand: the stack is at the edge already.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /apps/communication
    schedule:
      interval: monthly
