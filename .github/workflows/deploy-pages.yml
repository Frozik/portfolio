name: Deploy portfolio to GitHub Pages

# Deploys the commit whose CI run just passed on main. Pages → Source must be
# "GitHub Actions" (the gh-pages branch is no longer used).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Tags the commit and publishes a GitHub Release from its Conventional Commits
  # (feat → minor, fix / perf / refactor → patch, `!` → major); commits of other
  # types release nothing. Nothing is written back to the branch — the tag is the
  # version, and the build below reads it with `git describe`.
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release --extends ./libs/tooling/semantic-release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A commit that only touched the server must not republish the site. The
  # comparison starts from the commit actually live on Pages, so a skipped or
  # failed deploy is picked up by the next run, and `affected-projects` walks
  # Moon's dependency graph rather than a hand-written path list.
  gate:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: pnpm install --frozen-lockfile
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # The newest github-pages deployment that actually succeeded.
          live=""
          for id in $(gh api "/repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=10" --jq '.[].id'); do
            state="$(gh api "/repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // empty')"
            if [ "$state" = "success" ]; then
              live="$(gh api "/repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq '.sha')"
              break
            fi
          done

          if [ -z "$live" ]; then
            echo "No successful Pages deployment found — publishing"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Live on Pages: ${live}"

          if [ "$live" = "$HEAD_SHA" ]; then
            echo "Already published"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if ! git cat-file -e "${live}^{commit}" 2>/dev/null; then
            echo "Live commit is not in history — republishing to resync"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if pnpm exec affected-projects "$live" "$HEAD_SHA" --is portfolio; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history and tags: a rebuild stamps the app with `git describe --tags`.
          fetch-depth: 0
      # The CI run that triggered this deploy already built the portfolio with
      # the predicted version, so its artifact is what goes live.
      - name: Take the build from the CI run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: portfolio-dist
          path: apps/portfolio/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Manual runs, or a CI run whose affected set skipped the portfolio build.
      - name: Set up the toolchain for a rebuild
        if: hashFiles('apps/portfolio/dist/index.html') == ''
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - if: hashFiles('apps/portfolio/dist/index.html') == ''
        uses: actions/cache@v6
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ github.sha }}
          restore-keys: moon-${{ runner.os }}-
      - name: Rebuild
        if: hashFiles('apps/portfolio/dist/index.html') == ''
        run: |
          pnpm install --frozen-lockfile
          PORTFOLIO_VERSION="$(pnpm exec predict-version)" moon run portfolio:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/portfolio/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
