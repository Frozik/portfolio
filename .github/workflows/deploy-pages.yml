name: Deploy portfolio to GitHub Pages

# Requires the repository setting Pages → Source: "GitHub Actions". Until it is
# switched, `pnpm deploy:pages` (gh-pages branch) keeps working as before.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: moon run portfolio:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/portfolio/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
