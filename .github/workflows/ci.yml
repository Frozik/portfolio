name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Checks (moon ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install the Playwright browser for the e2e task
        run: moon run portfolio:install-browsers -- --with-deps
      - uses: actions/cache@v4
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ github.sha }}
          restore-keys: moon-${{ runner.os }}-
      # The version the release job will tag once this run is green, computed
      # from the same commits and rules — so the build below is the one that
      # gets deployed, and its cache hash changes with the version.
      - name: Predict the release version
        run: echo "PORTFOLIO_VERSION=$(pnpm exec predict-version)" >> "$GITHUB_ENV"
      - name: Affected checks, tests and builds
        run: moon ci --color
      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: Keep the portfolio build for the Lighthouse job
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: portfolio-dist
          path: apps/portfolio/dist
          if-no-files-found: ignore
          retention-days: 3

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      # Unused while `upload.target` is `filesystem` — LHCI only posts a commit
      # status from its `lhci` and `temporary-public-storage` targets. Granted
      # together with the token below so switching target is a one-line change
      # rather than a confusing 403.
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Nothing below goes through moon when the artifact is present, so moon never installs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ github.sha }}
          restore-keys: moon-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: portfolio-dist
          path: apps/portfolio/dist
      - name: Rebuild if the affected run skipped the portfolio build
        run: test -f apps/portfolio/dist/index.html || moon run portfolio:build
      - name: Lighthouse CI against the production build
        working-directory: apps/portfolio
        run: pnpm exec lhci autorun
        env:
          # Satisfies lhci's healthcheck, which warns whenever any upload target
          # is configured without a token, without checking whether that target
          # can use one. Unused today; ready if the target ever changes.
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The image the production box runs. On a pull request it is only built
  # (the old behaviour, a compile check); on main it is published to GHCR.
  #
  # Deliberately NOT gated on "did communication change": the deploy workflow
  # decides that, comparing against the commit the box is actually running, and
  # gating here too would let the two disagree — a commit CI skipped could be
  # one the deploy still wants, leaving it with no image to pull. Publishing
  # every main commit costs little (buildx reuses cached layers and GHCR
  # deduplicates them) and it means any commit can be rolled back to.
  server-image:
    name: Server image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      # GITHUB_TOKEN is minted per run — no secret to create or rotate.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry names must be lowercase; the GitHub owner is not (Frozik).
      - name: Lowercase the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/communication" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/communication/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # The box reports the running commit from this label.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
