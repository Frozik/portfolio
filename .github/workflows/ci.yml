name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Checks (moon ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install the Playwright browser for the e2e task
        run: moon run portfolio:install-browsers -- --with-deps
      - uses: actions/cache@v4
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ github.sha }}
          restore-keys: moon-${{ runner.os }}-
      # The version the release job will tag once this run is green, computed
      # from the same commits and rules — so the build below is the one that
      # gets deployed, and its cache hash changes with the version.
      - name: Predict the release version
        run: echo "PORTFOLIO_VERSION=$(pnpm exec predict-version)" >> "$GITHUB_ENV"
      - name: Affected checks, tests and builds
        run: moon ci --color
      - uses: moonrepo/run-report-action@v1
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: Keep the portfolio build for the Lighthouse job
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: portfolio-dist
          path: apps/portfolio/dist
          if-no-files-found: ignore
          retention-days: 3

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Nothing below goes through moon when the artifact is present, so moon never installs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ github.sha }}
          restore-keys: moon-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: portfolio-dist
          path: apps/portfolio/dist
      - name: Rebuild if the affected run skipped the portfolio build
        run: test -f apps/portfolio/dist/index.html || moon run portfolio:build
      - name: Lighthouse CI against the production build
        working-directory: apps/portfolio
        run: pnpm exec lhci autorun

  # The image the production box runs. On a pull request it is only built
  # (the old behaviour, a compile check); on main it is published to GHCR
  # and the deploy workflow rolls it out.
  server-image:
    name: Server image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      # GITHUB_TOKEN is minted per run — no secret to create or rotate.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/communication/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/communication:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/communication:latest
          # The box reports the running commit from this label.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
