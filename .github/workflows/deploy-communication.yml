# Deploys the communication server whenever CI goes green on main.
#
# Requires (all in place since 2026-09-20): the deploy keypair installed on the
# box by infra/roles/communication/deploy-user.sh behind an ssh forced command,
# the GitHub environment `production`, and its secrets DEPLOY_SSH_KEY,
# DEPLOY_HOST and DEPLOY_KNOWN_HOSTS.
name: Deploy communication

# Same gate as the Pages deploy: not "on push" but "when CI went green", so a
# red commit never reaches the box.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Two concurrent deploys would race for the same container. No
# cancel-in-progress: a half-finished deploy is worse than a queue.
concurrency:
  group: communication-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the gate below diffs against the deployed commit.
          fetch-depth: 0

      # Loads the key into an agent for this job only; never written to disk.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pinning the host key instead of StrictHostKeyChecking=no, which would
      # accept any machine answering on that address.
      - name: Trust the host key
        run: install -m 600 -D /dev/stdin ~/.ssh/known_hosts <<< '${{ secrets.DEPLOY_KNOWN_HOSTS }}'

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: pnpm install --frozen-lockfile

      # A portfolio-only commit must not restart the signaling server and drop
      # live WebRTC sessions. `affected-projects` walks Moon's real dependency
      # graph, so a change in libs/utils counts and a change in libs/components
      # does not — no hand-maintained path list to rot. The range starts at what
      # is actually deployed, so a skipped or failed deploy is picked up next time.
      - name: Does this commit touch the server?
        id: gate
        run: |
          deployed="$(ssh '${{ secrets.DEPLOY_HOST }}' head)"
          head='${{ github.event.workflow_run.head_sha || github.sha }}'
          echo "deployed=${deployed}" >> "$GITHUB_OUTPUT"

          if [ "$deployed" = "$head" ]; then
            echo "Already running ${head}"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # After a force-push the deployed commit may be gone from history.
          if ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
            echo "Deployed commit ${deployed} is not in history — deploying to resync"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if pnpm exec affected-projects "$deployed" "$head" --is communication; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Deploys the exact image CI built for this commit, not a floating :latest.
      - name: Deploy
        if: steps.gate.outputs.run == 'true'
        run: ssh '${{ secrets.DEPLOY_HOST }}' "deploy ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Nothing to do
        if: steps.gate.outputs.run != 'true'
        run: echo "Server unchanged since ${{ steps.gate.outputs.deployed }}"
